<style>
    /* Basic Reset & Defaults */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f8f9fa; /* Light grey background */
    }

    /* Container for centering content */
    .container {
        width: 90%;
        max-width: 960px; /* Max width for larger screens */
        margin: 0 auto; /* Center the container */
        padding: 0 15px; /* Add padding on the sides */
    }

    /* Header Styles */
    header {
        background-color: rgb(252, 252, 253); /* Very light gray background */
        color: #212529; /* Dark text color for readability */
        padding: 20px 0;
        text-align: center;
        margin-bottom: 30px;
        border-bottom: 1px solid rgb(222, 226, 230);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
    }

    header h1 {
        font-size: 2.5em;
        margin-bottom: 4px;
    }

    header .tagline {
        font-size: 1.1em;
        color: #aaa; /* Lighter text for tagline */
        margin-bottom: 20px;
    }

    /* Navigation Styles */
    nav ul {
        list-style: none;
    }

    nav ul li {
        display: inline-block; /* Arrange items horizontally */
        margin: 0 15px;
    }

    nav ul li a {
        color: #aaa;
        text-decoration: none;
        font-weight: bold;
        padding: 5px 0;
        transition: color 0.3s ease;
    }

    nav ul li a:hover {
        color: #007bff; /* Accent color on hover */
    }

    /* Main Content Area */
    main .container {
        background-color: #fff; /* White background for content */
        padding: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        border-radius: 5px;
    }

    /* Section Styling */
    main section {
        margin-bottom: 40px; /* Space between sections */
        padding-bottom: 15px;
        border-bottom: 1px solid #eee; /* Separator line */
    }

    main section:last-child {
        margin-bottom: 0; /* No bottom margin on last section */
        border-bottom: none; /* No separator on last section */
    }

    h2 {
        color: #0056b3; /* Darker blue for headings */
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: 1px solid #eee; /* Underline headings */
    }

    /* Call-to-Action Section */
    .cta-section {
        text-align: center;
        background-color: #e9ecef; /* Slightly different background */
        padding: 30px;
        border-radius: 5px;
        margin-top: 20px;
    }

    .cta-section h2 {
        border-bottom: none; /* No underline for CTA heading */
    }

    /* Button Styles */
    .button {
        display: inline-block;
        padding: 12px 25px;
        margin: 10px 5px;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        font-size: 1em;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease;
    }

    .button.primary {
        background-color: #007bff; /* Primary button color (blue) */
        color: #fff;
    }

    .button.primary:hover {
        background-color: #0056b3; /* Darker blue on hover */
        transform: translateY(-2px); /* Slight lift effect */
    }

    .button.secondary {
        background-color: #6c757d; /* Secondary button color (grey) */
        color: #fff;
    }

    .button.secondary:hover {
        background-color: #5a6268; /* Darker grey on hover */
        transform: translateY(-2px);
    }

    /* Link Styles within Content */
    main a {
        color: #007bff;
        text-decoration: none;
    }

    main a:hover {
        text-decoration: underline;
    }

    /* Footer Styles */
    footer {
        text-align: center;
        margin-top: 40px;
        padding: 20px 0;
        border-top: 1px solid #dee2e6; /* Separator line */
        font-size: 0.9em;
        color: #6c757d; /* Grey text */
    }

    footer a {
        color: #007bff;
    }

    /* Basic Responsiveness (Optional) */
    @media (max-width: 768px) {
        header h1 {
            font-size: 2em;
        }
        .container {
            width: 95%;
        }
    }
</style>
